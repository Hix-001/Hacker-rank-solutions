name: Update Contribution Heatmap

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'PYTHON/**'
      - 'CPP/**'
      - '30 DAYS OF CODE/**'
      - 'HEATMAP/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Heatmap Generator
        run: python HEATMAP/generate_heatmap.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HEATMAP/contribution_heatmap.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution heatmap."
          else
            git commit -m "Auto-update contribution heatmap [skip ci]"
            git push
          fi
